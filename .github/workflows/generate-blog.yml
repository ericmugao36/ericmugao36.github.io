name: Generate static blog articles

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**"
      - "generate_blog.py"
      - "blog.html"
      - "sitemap.xml"
      - ".github/workflows/generate-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-blog-generation
  cancel-in-progress: false

jobs:
  build-blog:
    name: Build and publish static article pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML Markdown bleach Pygments

      - name: Generate static article pages
        run: python generate_blog.py --verbose

      - name: Commit generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog.html sitemap.xml articles/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Generate static blog article pages"
          git push origin HEAD:main
